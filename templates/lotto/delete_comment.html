{% extends "base.html" %}

{% block title %}Delete Comment | Midas Lotto{% endblock %}

{% block content %}
<h1>Delete Comment</h1>

<p>Are you sure you want to delete this comment?</p>

<p>{{ comment.body }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        Yes, delete
    </button>
    <a href="{% url 'draw_detail' comment.draw.id %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
